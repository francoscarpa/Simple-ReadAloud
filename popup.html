<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            width: 220px;
            margin: 12px;
            background: #eadfc9;
            color: #202124;
        }

        label {
            display: block;
            margin-top: 10px;
            color: #3a3d41;
        }

        input[type=range] {
            width: 100%;
            accent-color: #1f7a6d;
        }

        button {
            margin-top: 18px;
            width: 100%;
            padding: 6px;
            cursor: pointer;
            color: #f8fbf9;
            background: #1f7a6d;
            border: 1px solid #15594f;
            border-radius: 6px;
            outline: none;
        }

        button:hover {
            background: #17665b;
            border-color: #0f4e45;
        }

        input[type=range] {
            cursor: pointer;
        }

        input[type=checkbox] {
            accent-color: #1f7a6d;
        }

        #speedValue {
            color: #0f665b;
        }

        #language {
            display: none;
        }

        .languageSelect {
            position: relative;
            margin-top: 6px;
            margin-bottom: 20px;
        }

        .languageTrigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0;
            box-sizing: border-box;
            color: #202124;
            background: #fffaf1;
            border-color: #b6a889;
        }

        .languageTrigger:hover,
        .languageSelect.open .languageTrigger {
            color: #102f2a;
            background: #f8eed9;
            border-color: #1f7a6d;
        }

        .languageChevron {
            width: 7px;
            height: 7px;
            border-right: 2px solid #1f7a6d;
            border-bottom: 2px solid #1f7a6d;
            transform: rotate(45deg);
        }

        .languageMenu {
            display: none;
            position: absolute;
            z-index: 2;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #fffaf1;
            border: 1px solid #b6a889;
            border-radius: 6px;
            box-shadow: 0 8px 18px rgba(55, 43, 22, 0.18);
            overflow: hidden;
        }

        .languageSelect.open .languageMenu {
            display: block;
        }

        .languageOption {
            padding: 7px 8px;
            color: #202124;
            background: #fffaf1;
            cursor: pointer;
        }

        .languageOption:hover,
        .languageOption.selected {
            color: #f8fbf9;
            background: #1f7a6d;
        }

        .speedPresets {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .speedPresetBtn {
            margin-top: 0;
            flex: 1;
            padding: 4px 0;
            color: #15594f;
            background: #e4f0ec;
            border-color: #9fc7bd;
        }

        .speedPresetBtn:hover {
            background: #d1e6df;
            border-color: #76afa2;
        }

        .toggleGroup {
            display: grid;
            gap: 8px;
            margin-top: 16px;
        }

        .switchLabel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-sizing: border-box;
            min-height: 42px;
            margin: 0;
            padding: 8px 10px;
            color: #24312e;
            background: #fffaf1;
            border: 1px solid #b6a889;
            border-radius: 8px;
            cursor: pointer;
        }

        .switchText {
            display: grid;
            gap: 2px;
        }

        .switchTitle {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.1;
        }

        .switchState {
            color: #65706d;
            font-size: 10px;
            line-height: 1.1;
        }

        .switchLabel input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .switchTrack {
            position: relative;
            flex: 0 0 auto;
            width: 44px;
            height: 24px;
            border-radius: 999px;
            background: #c7bca5;
            box-shadow: inset 0 0 0 1px rgba(32, 33, 36, 0.12);
            transition: background 140ms ease, box-shadow 140ms ease;
        }

        .switchTrack::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fffaf1;
            box-shadow: 0 2px 4px rgba(32, 33, 36, 0.24);
            transition: transform 140ms ease;
        }

        .switchLabel input:checked + .switchTrack {
            background: #1f7a6d;
            box-shadow: inset 0 0 0 1px #15594f;
        }

        .switchLabel input:checked + .switchTrack::after {
            transform: translateX(20px);
        }

        .switchLabel input:focus-visible + .switchTrack {
            outline: 2px solid #0f665b;
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <label>
        Language:
        <select id="language">
            <option value="en-US">English</option>
            <option value="it-IT">Italian</option>
        </select>
        <div class="languageSelect" id="languageSelect">
            <button type="button" class="languageTrigger" id="languageTrigger" aria-haspopup="listbox" aria-expanded="false">
                <span id="languageText">Italian</span>
                <span class="languageChevron"></span>
            </button>
            <div class="languageMenu" id="languageMenu" role="listbox">
                <div class="languageOption" role="option" data-language="en-US">English</div>
                <div class="languageOption" role="option" data-language="it-IT">Italian</div>
            </div>
        </div>
    </label>
    <label>
        Speed: <span id="speedValue">1</span>x
        <div class="speedPresets">
            <button type="button" class="speedPresetBtn" data-speed="1.5">1.5</button>
            <button type="button" class="speedPresetBtn" data-speed="2">2</button>
            <button type="button" class="speedPresetBtn" data-speed="2.5">2.5</button>
            <button type="button" class="speedPresetBtn" data-speed="3">3</button>
        </div>
        <input type="range" min="0.5" max="3" step="0.1" id="speed" value="2.4">
    </label>
    <div class="toggleGroup">
        <label class="switchLabel" for="hoverInfoEnabled">
            <span class="switchText">
                <span class="switchTitle">Hover pyramid</span>
                <span class="switchState" id="hoverInfoState">ON</span>
            </span>
            <input type="checkbox" id="hoverInfoEnabled" checked>
            <span class="switchTrack" aria-hidden="true"></span>
        </label>
        <label class="switchLabel" for="readAloudEnabled">
            <span class="switchText">
                <span class="switchTitle">Read aloud</span>
                <span class="switchState" id="readAloudState">OFF</span>
            </span>
            <input type="checkbox" id="readAloudEnabled">
            <span class="switchTrack" aria-hidden="true"></span>
        </label>
    </div>
    <button id="saveBtn">Save</button>
    <script src="popup.js"></script>
</body>

</html>
